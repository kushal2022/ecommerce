server:
  port: 8080

spring:
  security:
    user:
      name: root
      password: 12345
  application:
    name: ecom-system
  datasource:
    # Modern MySQL 8.0+ Driver
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/ecom?createDatabaseIfNotExist=true&autoReconnect=true&useSSL=false
    username: root
    password: "12345@ME"
    hikari:
      maximum-pool-size: 10
  jpa:
    show-sql: false
    hibernate:
      # Automatically creates/updates tables based on your @Entity classes
      ddl-auto: update
    properties:
      hibernate:
        # Modern Hibernate 6+ dialect
        dialect: org.hibernate.dialect.MySQLDialect